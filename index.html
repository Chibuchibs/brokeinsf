      await navigator.clipboard.writeText(url ? `${text}\n${url}` : text);
      $('share').textContent = 'Copied. Go and paste it somewhere.';
    } catch {
      /* They dismissed the sheet, or the clipboard is blocked. Neither is
         an error worth a message. */
    }
  };

  $('again').onclick = () => {
    try { localStorage.removeItem(SAVE); } catch {}
    location.reload();
  };
  /* The only way out of this card used to be wiping the save. It is the one
     screen a player might want to sit with — and the city is still there
     behind it. Closing it leaves them standing in it; the goal strip brings
     the card back. */
  $('stay').onclick = () => { endShown = false; close(); };
}

/* ---- you have to eat ----
   Raised once per day the moment energy runs low. You still have to walk
   there and pay at the counter — picking from this list only sets the
   route — but the day no longer lets you quietly skip the one expense
   nobody in this city avoids. */
let askedFoodOn = 0;
function foodCard() {
  const here = nodes.get(me.at);
  const walk = p => {
    const d = Math.hypot(p.at[0] - me.x, p.at[1] - me.y);
    return Math.round(d * 0.67 / 10) * 10;             // metres, roughly
  };
  open(`<h2>You need to eat</h2>
    <div class="sub">Energy is down to ${Math.round(s.energy)}. Nothing on this
      list is free, and that is rather the point.</div>
    ${G.FOOD_PLACES.map(p => `
      <div class="row">
        <div>
          <div class="l">${p.icon} ${esc(p.name)}</div>
          <div class="d">+${p.energy} energy &middot; ${walk(p)}m away</div>
        </div>
        <div style="display:flex;gap:11px;align-items:center">
          <span class="pay">${G.money(p.cost)}</span>
          <button data-eat="${p.id}"${s.money < p.cost ? ' disabled' : ''}>Go</button>
        </div>
      </div>`).join('')}
    <div class="note" style="margin-bottom:12px">Keep working on an empty
      stomach and you will stop in the street for an hour instead.</div>
    <button style="width:100%" id="skipfood">Later</button>`);
  sheet.querySelectorAll('[data-eat]').forEach(b => b.onclick = () => {
    const p = PLACES.find(q => q.id === b.dataset.eat);
    me.path = route(me.at, p.door.k) || [];
    flash(`${p.name}. ${G.money(p.cost)} when you get there.`);
    close(); hud(); persist();
  });
  $('skipfood').onclick = close;
}

/* ---- standing outside a place ---- */
function openPlace(p) {
  const acts = [];
  /* Anywhere that sells something, not just the restaurants — the corner
     store has a price and an energy value too, and gating this on the
     'food' kind sent you there with nothing to buy when you arrived. */
  if (p.cost != null && p.energy != null)
    acts.push([`Eat &middot; ${G.money(p.cost)} &middot; +${p.energy} energy`,
               () => { SND.ping('eat'); done(G.eat(s, p)); }]);
  if (p.kind === 'work') {
    const mine = s.job && s.job.id === p.id;
    /* Your own workplace is not a job ad. It kept offering to take a resume
       from somebody it had already employed. */
    if (!mine) acts.push([`Hand in your resume`, () => {
      const r = G.apply(s, p);
      SND.ping(r.ok ? 'hired' : 'no');
      done(r.line, r.ok ? 'good' : '');
    }]);
    if (mine) {
      const sp = G.shiftPreview(s);
      acts.push([sp.tooLate
        ? 'Too late to start a shift'
        : `Work the shift &middot; ${sp.hours}h &middot; about ${G.money(sp.net)} after tax`,
        () => { SND.ping('shift'); done(G.workShift(s), 'good'); }]);
    }
  }
  if (p.kind === 'night' && G.socialOpen(s)) {
    /* Once there is somebody, the button stopped being about meeting people
       and never said so — "Go out" is what you tap for the eighth evening
       running with the person the rest of the game is about. */
    const can = G.canGoOut(s, p);
    const label = !can.ok ? can.why
      : s.partner
      ? `Take ${esc(s.partner.name)} out${p.cost ? ' &middot; ' + G.money(p.cost) : ''}`
      : p.cost ? `Go out &middot; ${G.money(p.cost)}` : 'Stay a while';
    const evening = () => {
      const hadF = s.friends, hadP = !!s.partner;
      const line = G.goOut(s, p);
      SND.ping(!hadP && s.partner ? 'met' : s.friends > hadF ? 'friend' : 'spend');
      done(line, 'good');
    };
    acts.push([label, can.ok ? () => s.pref ? evening() : askPref(evening) : close]);
  }
  if (p.kind === 'room' && !s.sro && !s.leased)
    acts.push([`Take the room &middot; ${G.money(G.SRO_MOVE_IN)} up front`,
               () => { const l = G.takeRoom(s); SND.ping(s.sro ? 'keys' : 'no'); done(l, 'good'); }]);
  if (p.kind === 'apartment' && !s.leased)
    acts.push([`Apply for the lease &middot; ${G.money(G.MOVE_IN_COST)}`,
               () => { const l = G.signLease(s); SND.ping(s.leased ? 'keys' : 'no'); done(l, 'good'); }]);
  /* Wherever you actually live. This was on the studio alone, so a player
     who stayed at the Alder — the path the room exists to make possible —
     was told by the You panel to ask them at their place, walked to their
     place, and found nothing there to tap. */
  const home = (p.kind === 'apartment' && s.leased) || (p.kind === 'room' && s.sro);
  if (home && G.canMoveIn(s))
    acts.push([`Ask ${esc(s.partner.name)} to move in`,
      () => { const l = G.moveIn(s); SND.ping(s.movedIn ? 'end' : 'no'); done(l, 'good'); }]);
  if (home || (p.kind === 'couch' && !G.housed(s)))
    acts.push(['Sleep', () => {
      /* Sleeping is where rent is taken and where the couch runs out, and
         sleep() reports both into the log. Flashing a bare "Morning." threw
         those away, so the player watched $2,100 leave with no explanation
         on screen at all — the largest recurring cost in the game, silent. */
      const before = s.log.length;
      SND.ping('sleep');
      G.sleep(s);
      const fresh = s.log.slice(0, s.log.length - before).reverse();
      close(); hud(); persist();
      if (!fresh.length) { flash('Morning.'); return; }
      fresh.forEach((e, i) => setTimeout(() => flash(e.text, e.kind), i * 850));
    }]);
  if (p.id === 'corner' && s.leased && !s.car)
    acts.push([`Buy the car off the board &middot; ${G.money(G.CAR_COST)}`,
               () => { const l = G.buyCar(s); SND.ping(s.car ? 'car' : 'no'); done(l, 'good'); }]);

  /* What the card in the window actually says. */
  let posting = '', blurb = p.blurb;

  /* Somewhere to live says what it is and what it asks, the way a job ad
     does. "Bathroom down the hall. $1,200 every 30 days" was the whole
     description of the room — which reads as a price on a hallway, and
     never said the thing that matters: your own lockable door, month to
     month, nobody checking your income. The two places are the real choice
     in the middle of this game and the player could not compare them. */
  const terms = (what, detail, rent, asks) => `<div class="row">
      <div><div class="l">${what}</div><div class="d">${detail}</div></div>
      <div style="text-align:right;line-height:1.15">
        <div class="pay">${G.money(rent)}</div>
        <div class="d" style="font-size:11px">a month</div></div></div>
    <div class="note" style="margin-bottom:12px">${asks}</div>`;

  if (p.kind === 'room') {
    if (s.sro) blurb = 'Your room. A bed, a sink, and a window onto Turk Street.';
    posting = terms('One room, shared bathroom',
      'A bed, a sink, a lock on your door. Kitchen and bathroom on the landing.',
      G.SRO_RENT,
      s.sro ? `Month to month. ${G.money(G.SRO_RENT)} is due every 30 days.`
        : `Month to month — no lease, no employer, no credit check. They want the ` +
          `first month and the last up front: ${G.money(G.SRO_MOVE_IN)}.`);
  }
  /* What an evening here costs and what it is worth, so the three places
     can be told apart before you walk across town to one of them. */
  if (p.kind === 'night' && G.socialOpen(s)) {
    /* Keyed off what it costs, not off the lift value — the lifts get
       retuned every time the last act is rebalanced and the labels silently
       stopped telling the three places apart the first time they were. */
    const pace = !p.cost ? 'Cheap, and slow'
      : p.cost >= 30 ? 'The big night out' : 'A proper evening';
    posting = `<div class="row">
      <div><div class="l">${esc(pace)}</div>
        <div class="d">${p.opens > 12 ? 'From ' + G.clock(p.opens * 60) + '.' : 'Any time of day.'}
          ${s.partner ? 'Moves things along ' + (p.lift >= 20 ? 'fast' : p.lift >= 14 ? 'steadily' : 'slowly') + '.'
            : Math.round(p.meet * 100) + ' nights in a hundred come to something.'}</div></div>
      <div style="text-align:right;line-height:1.15">
        <div class="pay">${p.cost ? G.money(p.cost) : 'Free'}</div>
        <div class="d" style="font-size:11px">an evening</div></div></div>`;
  }
  if (p.kind === 'apartment') {
    if (s.leased) blurb = 'Your place. One room, one window, and the door is yours.';
    posting = terms('One room, your own bathroom',
      'Your own kitchen, your own bathroom, your own front door.',
      G.RENT,
      s.leased ? `${G.money(G.RENT)} is due every 30 days.`
        : `A year's lease. They want an employer, ${G.STUBS_NEEDED} recent pay stubs and ` +
          `${G.INCOME_MULTIPLE}x the rent coming in — plus ${G.money(G.STUDIO_COST)} first and ` +
          `deposit and ${G.money(G.APP_FEE)} to run your credit.`);
  }
  if (p.kind === 'work') {
    const mine = s.job && s.job.id === p.id;
    const m = G.matchAt(s, p);
    /* The card in the window stays in the window until it is your window. */
    if (mine) blurb = `You work here. ${s.shifts} shift${s.shifts === 1 ? '' : 's'} so far.`;
    posting = `<div class="row">
      <div><div class="l">${esc(p.role)}</div>
        <div class="d">${mine ? 'Your job' : 'They want: ' + m.wants.join(', ')}</div></div>
      <div style="text-align:right;line-height:1.15">
        <div class="pay">${G.money(p.pay)}</div>
        <div class="d" style="font-size:11px">an hour</div></div></div>
      ${mine ? '' : `<div class="note" style="margin-bottom:12px">${esc(m.verdict)}</div>`}`;
  }

  if (!acts.length) { flash(`${p.name}. ${p.blurb}`); return; }
  open(`<h2>${esc(p.name)}</h2><div class="sub">${esc(blurb)}</div>${posting}
    ${acts.map((a, i) => `<button class="p" style="width:100%;margin-bottom:9px"
        data-a="${i}">${a[0]}</button>`).join('')}
    <button id="away" style="width:100%">Walk on</button>`);
  sheet.querySelectorAll('[data-a]').forEach(b =>
    b.onclick = () => acts[+b.dataset.a][1]());
  $('away').onclick = close;

  function done(line, kind='') {
    if (line) { G.say(s, line, kind); flash(line, kind); }
    close(); hud(); persist();
  }
}

/* ====================================================================
   LOOP
   ==================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;

  /* ---- when the clock is held ----
     Reading is not playing. A panel is modal, so nothing moves behind it; and
     standing still with the map dragged somewhere else is the player working
     out where to go. Either way the clock stops, because otherwise looking up
     your destination is what costs you the delivery — which is exactly how a
     run was lost while testing.

     Walking with the map panned away still burns time, so panning is not a
     way to cross the city for free. The street itself keeps moving in both
     cases: a frozen city behind an open panel reads as a hung page. */
  const inPanel = sheet.style.display === 'block';
  const held = inPanel || (cam.free && !me.path.length);

  me.walking = me.path.length > 0 && !inPanel;
  if (me.path.length && !inPanel) {
    let move = SPEED * dt;
    while (move > 0 && me.path.length) {
      const n = me.path[0];
      const d = Math.hypot(n.x - me.x, n.y - me.y);
      /* Face the way you are going. Turning instantly looks like a glitch at
         a corner, so swing round to the new heading over a few frames — and
         go the short way round, or they spin 350 degrees to turn left. */
      if (d > 0.01) {
        const want = Math.atan2(n.y - me.y, n.x - me.x);
        let turn = want - me.heading;
        while (turn > Math.PI) turn -= Math.PI * 2;
        while (turn < -Math.PI) turn += Math.PI * 2;
        me.heading += turn * Math.min(1, dt * 11);
      }
      if (d <= move) {
        me.x = n.x; me.y = n.y; move -= d;
        me.phase = stepPhase(me.phase, d); footfall();
        me.path.shift();
        G.walked(s, d);
        if (!me.path.length) arrived(n.k); else me.at = n.k;
      } else {
        me.x += (n.x - me.x) / d * move;
        me.y += (n.y - me.y) / d * move;
        me.phase = stepPhase(me.phase, move); footfall();
        G.walked(s, move);
        move = 0;
      }
    }
  }

  /* How much city is within earshot. Traffic near you is the whole bed —
     a back street in the Tenderloin should be quiet and standing on Market
     should not be, and the vehicles already know where they are. */
  let near = 0;
  for (const c of CARS) {
    const d = Math.hypot(c.x - me.x, c.y - me.y);
    if (d < 300) near += (1 - d / 300) * (c.kind.id === 'bus' ? 1.7 : 1);
  }
  SND.ambience(Math.min(1, near / 7));

  /* The one sound this city has that no other city has. Rung only when you
     are near the lines that actually carry it. */
  bellTimer -= dt;
  if (bellTimer <= 0) {
    bellTimer = 4 + Math.random() * 7;
    const onCalifornia = Math.abs(me.y - 380) < 70 && me.x > 200 && me.x < 940;
    const onHyde = Math.abs(me.x - 560) < 70 && me.y > 120 && me.y < 1040;
    if ((onCalifornia || onHyde) && Math.random() < 0.45) SND.bell();
  }

  stepPeds(dt);
  stepCars(dt);
  if (!held) G.tick(s, dt);

  /* Once a day, when you start running down and nothing else is in the way. */
  if (G.hungry(s) && askedFoodOn !== s.day && !s.over &&
      sheet.style.display !== 'block') {
    askedFoodOn = s.day;
    foodCard();
  }

  document.getElementById('clockchip').classList.toggle('held', held && !s.over);
  if (s.over) showEnd();
  if (!cam.free) {
    cam.x += (me.x - cam.x) * Math.min(1, dt * 4.2);
    cam.y += (me.y - cam.y) * Math.min(1, dt * 4.2);
  }
  $('back').style.display = cam.free ? 'block' : 'none';

  paint(); hud();
  requestAnimationFrame(frame);
}

/* ---- faces ----
   The host is the only reason you have a roof for thirty days, and they were
   a name in one sentence and nothing else. Drawn rather than photographed,
   and flat enough to sit beside the rest of the art. */
const FACES = {
  dre:    { skin: '#6b4228', hair: '#17110d', top: '#33465c', long: false },
  amanda: { skin: '#c98f63', hair: '#3a2418', top: '#7a3f3f', long: true  },
};
function faceSVG(id, size = 58) {
  const f = FACES[id];
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="32" fill="#efece3"/>
    <path d="M6 64 a26 22 0 0 1 52 0 z" fill="${f.top}"/>
    <rect x="27" y="37" width="10" height="10" rx="5" fill="${f.skin}"/>
    ${f.long ? `<rect x="15" y="24" width="7.5" height="23" rx="3.75" fill="${f.hair}"/>
                <rect x="41.5" y="24" width="7.5" height="23" rx="3.75" fill="${f.hair}"/>` : ''}
    <circle cx="32" cy="26" r="15" fill="${f.hair}"/>
    <circle cx="32" cy="29" r="13.2" fill="${f.skin}"/>
    <circle cx="27" cy="28" r="1.7" fill="#241a14"/>
    <circle cx="37" cy="28" r="1.7" fill="#241a14"/>
    <path d="M28.5 34.5 q3.5 2.8 7 0" stroke="#241a14" stroke-width="1.6"
          fill="none" stroke-linecap="round"/>
  </svg>`;
}

/* ---- first run ----
   This used to be two flashes that faded after four seconds, so the only
   instruction in the game was gone before a new player had finished looking
   at the map. A card they dismiss themselves cannot be missed. */
function arrivalCard() {
  const h = G.hostOf(s);
  open(`<h2>You just got here</h2>
    <div class="sub">You moved to San Francisco for a job you don't have yet.
      You have ${G.money(s.money)}, and ${h.name} said you could take the couch
      for a month.</div>
    <div class="row"><div>
      <div class="l">What you are working toward</div>
      <div class="d">Work that covers your own rent — and your own lease,
        before the couch runs out on day ${G.COUCH_DAYS}.</div></div></div>
    <div class="row"><div>
      <div class="l">Deliveries pay today</div>
      <div class="d">Find work, collect, drop off, get paid. It is what keeps
        you eating while you look for the real thing.</div></div></div>
    <div class="row"><div>
      <div class="l">A job pays the rent</div>
      <div class="d">Write a resume, hand it in at the green places. A steady
        wage is the only thing that covers ${G.money(G.RENT)} a month.</div>
      </div></div>
    <div class="row"><div>
      <div class="l">Getting around</div>
      <div class="d">Tap a street to walk there. Drag the map to look around.</div>
      </div></div>
    <div class="note" style="margin-bottom:12px">Everything about your
      situation lives under <b>You</b>, bottom right${SND.available()
        ? ' — including the sound, if you would rather have it off' : ''}.</div>
    <button class="p" style="width:100%" id="go">Start the day</button>`);
  $('go').onclick = () => { close(); persist(); };
}

/* Pick whose couch it is before anything else. */
function hostCard() {
  open(`<h2>Whose couch?</h2>
    <div class="sub">Somebody you know from before put you up for a month.</div>
    <div class="hosts">${G.HOSTS.map(h => `
      <button class="host" data-h="${h.id}">
        ${faceSVG(h.id)}<span>${h.name}</span>
      </button>`).join('')}</div>`);
  /* This one you have to answer. open() hangs close() on the veil like
     every other sheet, so a tap outside dismissed the card without a
     choice — and it is only ever raised once, so s.host stayed null, the
     game quietly fell back to Dre, and there was no way back to it. */
  veil.onclick = null;
  sheet.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
    veil.onclick = close;
    s.host = b.dataset.h;
    /* The place on the map is named after whoever you picked. */
    const couchPlace = PLACES.find(p => p.id === 'couch');
    couchPlace.name = `${G.hostOf(s).name}'s place`;
    persist();
    arrivalCard();
  });
}

/* Ask whenever there is no host, not only on a fresh save — otherwise a
   run that lost the card to a stray tap can never be given one. */
if (!s.host) {
  if (!s.log.length) G.say(s, 'You got in last night.', '');
  hostCard();
} else if (s.host) {
  PLACES.find(p => p.id === 'couch').name = `${G.hostOf(s).name}'s place`;
}
setInterval(persist, 5000);
requestAnimationFrame(frame);
</script>
</body>
</html>
